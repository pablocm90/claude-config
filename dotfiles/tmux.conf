set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Ghostty advertises Tc/setrgbb but not the RGB flag; declare it so hex
# colours render exactly instead of snapping to the nearest 256-colour.
set -sa terminal-features ",xterm-ghostty:RGB"

set -g mouse on
set -g history-limit 50000
set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

set -g status-interval 5
set -g status-style "bg=colour234,fg=colour250"
set -g status-left-length 40
set -g status-right-length 120
set -g status-left "#[bg=#4a2aa4,fg=colour255,bold] #S #[bg=colour234,fg=colour244] | #{?client_prefix,#[fg=colour203]PREFIX ,}"
# The button shows which task currently owns :3000: green when that is this
# window, grey when another task holds it (clicking takes it over), "serve"
# when nothing is running. --refresh publishes @serving and prints nothing,
# so the label comes from ordinary format conditionals rather than from #()
# output — no styles are emitted by the shell command.
set -g status-right "#(claude-dev serving --refresh --session #{session_name})#[range=user|serve]#{?#{==:#{@serving},#{window_name}},#[bg=colour28],#[bg=colour238]}#[fg=colour255,bold] ▶ #{?#{@serving},#{@serving},serve} #[bg=colour234,fg=colour250]#[norange]  %Y-%m-%d %H:%M"

# Quick pane navigation without prefix.
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Window switching without prefix (Alt+Left/Right).
bind -n M-Left previous-window
bind -n M-Right next-window

# Status (prefix + D): open a PR/CI status pane (close with prefix + X).
bind D split-window -h -l 45% -c "#{pane_current_path}" "bash -lc claude-dev-status"

# Review (prefix + r): terminal diff review of the current task window in a
# popup (delta: colour, syntax highlight, n/N to jump between files). Quit the
# pager with q to close; on error the popup stays open (dismiss with Escape).
# Wrapped in run-shell because display-popup does not expand #{window_name} in
# its command (tmux 3.4); run-shell does, against the window the key was pressed.
# claude-dev builds the popup rather than this binding: a popup is drawn on a
# client, and with several workspaces attached tmux draws it on the first one.
bind r run-shell -b 'claude-dev review-popup #{window_name}'

# Close current pane (prefix + X).
bind X kill-pane

# Window tabs: colour the background instead of relying on the #F flag glyphs.
# Active = blue, bell/notified = orange, activity = grey. The padded format
# turns each entry into a solid block so the background reads as a tab.
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags}, } "
setw -g window-status-separator ""
setw -g window-status-style "bg=colour234,fg=colour250"
setw -g window-status-current-style "bg=#4a2aa4,fg=colour255,bold"
setw -g window-status-bell-style "bg=colour214,fg=colour234,bold"
setw -g window-status-activity-style "bg=colour240,fg=colour255,bold"

# Serve (prefix + S): run this task's dev stack in its worktree panes and stop
# every other one — the workspace ports are global (3000/4000 unless
# .claude/ports says otherwise), so only one task can serve at a time. prefix + S again restarts; `claude-dev serve --stop` just
# stops. Wrapped in run-shell for the same reason as prefix + r: it expands
# #{window_name} against the window the key was pressed in.
bind S run-shell -b 'claude-dev serve #{window_name}'

# Clickable version of prefix + S: the "▶ serve" block in status-right is a
# range=user|serve region, which fires the Status mouse key — the same key that
# selects a window tab, so dispatch on the range and fall through to the
# default select-window for every other click on the status line.
bind -n MouseDown1Status if-shell -F "#{==:#{mouse_status_range},serve}" {
  run-shell -b "claude-dev serve #{window_name}"
} {
  select-window -t=
}
